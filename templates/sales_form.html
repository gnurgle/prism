{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Record Item Sale</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Select Sold Item (`ITM` FK)</label>
                        <select name="ITEMID" class="form-select" required>
                            <option value="">-- Choose Item --</option>
                            {% for item in items %}
                                <option value="{{ item.ITEMID }}">{{ item.ITMNAME }} (ID: #{{ item.ITEMID }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Units Sold (SUNITS)</label>
                        <input type="number" name="SUNITS" class="form-control" min="1" value="1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Venue (`VENUE` FK)</label>
                        <select name="VENUEID" class="form-select">
                            <option value="">-- Direct Sale (No Venue) --</option>
                            {% for v in venues %}
                                <option value="{{ v.VENUEID }}">{{ v.VENUELOC }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('list_sales') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Complete Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
