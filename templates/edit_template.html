{% extends 'base.html' %}



{% block content %}

<!-- Top Control Bar (Save Button Removed) -->

<div class="row mb-3">

    <div class="col-12 d-flex justify-content-between align-items-center">

        <h4 class="mb-0">Edit Template: {{ item.ITMNAME }}</h4>

        <a href="{{ url_for('index') }}" class="btn btn-outline-dark btn-sm">Done</a>

    </div>

</div>



<div class="row">

    <!-- Main Focus: SVG Display (Left Side) -->

    <div class="col-lg-8 mb-4">

        <div class="card shadow-sm h-100">

            <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">

                <div class="svg-container border rounded bg-white p-3 w-100 position-relative" style="height: 70vh; overflow: hidden; display: flex; justify-content: center; align-items: center;">

                    <object data="{{ url_for('static', filename=item.ITMSVG) }}" type="image/svg+xml" id="svg-object" style="width: 100%; height: 100%; object-fit: contain;"></object>

                </div>

            </div>

        </div>

    </div>



    <!-- Sidebar: Path List & Deletion (Right Side) -->

    <div class="col-lg-4 mb-4">

        <div class="card shadow-sm h-100">

            <div class="card-header bg-secondary text-white">

                <h5 class="mb-0">SVG Paths</h5>

            </div>

            <div class="card-body p-3" style="max-height: 75vh; overflow-y: auto;">

                <ul class="list-group" id="path-list-group">

                    {% if paths_list %}

                        {% for p in paths_list %}

                            <li class="list-group-item list-group-item-action path-list-item flex-column align-items-start mb-2" data-path-index="{{ p.index }}" style="cursor: pointer;">

                                <div class="d-flex w-100 justify-content-between align-items-center">

                                    <h6 class="mb-1 fw-bold">Path #{{ p.label }}</h6>

                                    <small class="text-muted">Index: {{ p.index }}</small>

                                </div>

                                <!-- Expanded Action Area (Hidden by default) -->

                                <div class="delete-container mt-2" style="display: none;">

                                    <form method="POST" class="d-inline">

                                        <input type="hidden" name="region_id" value="{{ p.label }}">

                                        <button type="submit" class="btn btn-danger btn-sm w-100" onclick="return confirm('Are you sure you want to delete region {{ p.label }}?');">Delete This Path</button>

                                    </form>

                                </div>

                            </li>

                        {% endfor %}

                    {% else %}

                        <div id="js-fallback-loading" class="text-muted text-center my-2">Loading paths from SVG...</div>

                    {% endif %}

                </ul>

            </div>

        </div>

    </div>

</div>



<script>

document.addEventListener("DOMContentLoaded", function() {

    const svgObject = document.getElementById('svg-object');

    let svgDoc = null;



    svgObject.addEventListener('load', function() {

        svgDoc = svgObject.contentDocument;

        if (!svgDoc) return;



        const svgElement = svgDoc.querySelector('svg');

        if (!svgElement) return;



        if (!svgElement.getAttribute('viewBox')) {

            svgElement.setAttribute('viewBox', '0 0 800 800');

        }



        let svgHeight = 800;

        const viewBox = svgElement.getAttribute('viewBox');

        if (viewBox) {

            const parts = viewBox.split(/[\s,]+/);

            if (parts.length === 4) {

                const vbH = parseFloat(parts[3]);

                if (!isNaN(vbH) && vbH > 0) svgHeight = vbH;

            }

        }



        const calculatedFontSize = svgHeight * 0.05;



        let paths = svgDoc.querySelectorAll('path');

        if (paths.length === 0) {

            paths = svgDoc.getElementsByTagNameNS('*', 'path');

        }



        const listGroup = document.getElementById('path-list-group');

        const fallbackMsg = document.getElementById('js-fallback-loading');

        if (fallbackMsg && paths.length > 0) {

            fallbackMsg.remove();

            

            Array.from(paths).forEach((path, index) => {

                const num = path.getAttribute('data-region-id') || path.getAttribute('data-number') || (index + 1);

                

                const li = document.createElement('li');

                li.className = 'list-group-item list-group-item-action path-list-item flex-column align-items-start mb-2';

                li.setAttribute('data-path-index', index);

                li.style.cursor = 'pointer';



                li.innerHTML = `

                    <div class="d-flex w-100 justify-content-between align-items-center">

                        <h6 class="mb-1 fw-bold">Path #${num}</h6>

                        <small class="text-muted">Index: ${index}</small>

                    </div>

                    <div class="delete-container mt-2" style="display: none;">

                        <form method="POST" class="d-inline">

                            <input type="hidden" name="region_id" value="${num}">

                            <button type="submit" class="btn btn-danger btn-sm w-100" onclick="return confirm('Are you sure you want to delete region ${num}?');">Delete This Path</button>

                        </form>

                    </div>

                `;

                listGroup.appendChild(li);

            });



            bindSidebarEvents();

        }



        Array.from(paths).forEach((path, index) => {

            const num = path.getAttribute('data-region-id') || path.getAttribute('data-number') || (index + 1);

            

            if (!path.getAttribute('fill') || path.getAttribute('fill') === 'none') {

                path.setAttribute('fill', 'rgba(0,0,0,0)');

            }



            try {

                const bbox = path.getBBox();

                if (bbox && bbox.width > 0 && bbox.height > 0) {

                    const cx = bbox.x + bbox.width / 2;

                    const cy = bbox.y + bbox.height / 2;



                    const textEl = svgDoc.createElementNS("http://www.w3.org/2000/svg", "text");

                    textEl.setAttribute("x", cx);

                    textEl.setAttribute("y", cy);

                    textEl.setAttribute("fill", "#dc3545");

                    textEl.setAttribute("font-weight", "bold");

                    textEl.setAttribute("font-size", calculatedFontSize + "px");

                    textEl.setAttribute("text-anchor", "middle");

                    textEl.setAttribute("dominant-baseline", "central");

                    textEl.setAttribute("style", "pointer-events: none; user-select: none;");

                    textEl.textContent = num;



                    svgElement.appendChild(textEl);

                }

            } catch (err) {}

        });

    });



    function bindSidebarEvents() {

        document.querySelectorAll('.path-list-item').forEach(item => {

            item.replaceWith(item.cloneNode(true));

        });



        document.querySelectorAll('.path-list-item').forEach(item => {

            item.addEventListener('click', function(e) {

                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'FORM' || e.target.closest('form')) return;



                const targetIndex = parseInt(this.getAttribute('data-path-index'));



                document.querySelectorAll('.path-list-item').forEach(li => {

                    li.classList.remove('active');

                    li.querySelector('.delete-container').style.display = 'none';

                });



                this.classList.add('active');

                this.querySelector('.delete-container').style.display = 'block';



                if (svgDoc) {

                    let paths = svgDoc.querySelectorAll('path');

                    if (paths.length === 0) paths = svgDoc.getElementsByTagNameNS('*', 'path');



                    Array.from(paths).forEach((p, idx) => {

                        if (idx === targetIndex) {

                            p.setAttribute('stroke', 'red');

                            p.setAttribute('stroke-width', '3');

                        } else {

                            p.removeAttribute('stroke');

                            p.removeAttribute('stroke-width');

                        }

                    });

                }

            });

        });

    }



    bindSidebarEvents();

});

</script>

{% endblock %}
