{% extends 'base.html' %}



{% block content %}

<div class="container py-4">

    <!-- Header with Dashboard Reference -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

        </div>

    </div>



    <!-- Dynamic Container -->

    <div id="hub-container" class="row g-4">

        <!-- Blocks loaded dynamically via JavaScript -->

    </div>

</div>



<!-- Custom Styles for Square Ratio, Uniform Size, and Animations -->

<style>

    .square-box {

        aspect-ratio: 1 / 1;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

    }

    .hub-card {

        cursor: pointer;

        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;

    }

    .hub-card:hover {

        transform: translateY(-4px);

        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;

    }

    .fade-transition {

        animation: fadeInScale 0.3s ease-in-out forwards;

    }

    @keyframes fadeInScale {

        from {

            opacity: 0;

            transform: scale(0.95);

        }

        to {

            opacity: 1;

            transform: scale(1);

        }

    }

</style>



<!-- Dynamic Navigation Script -->

<script>

    const categoryConfig = {

        'Items': {

            icon: 'fa-boxes-stacked',

            bg: 'bg-primary text-white',

            subBg: 'bg-primary text-white',

            backBg: 'bg-secondary text-white',

            items: [

                { name: 'Go Back', url: '#', action: 'goBack', isBack: true, icon: 'fa-arrow-left' },

                { name: 'Create Item', url: "{{ url_for('item_bp.create_item') }}", icon: 'fa-square-plus' },

                { name: 'Create Item Variation', url: "{{ url_for('item_bp.color_variation_select') }}", icon: 'fa-palette' },

                { name: 'List Items', url: "{{ url_for('item_bp.item_list') }}", icon: 'fa-list-check' },

                { name: 'Item Inventory', url: "{{ url_for('item_bp.item_inventory') }}", icon: 'fa-boxes-stacked' },

                { name: 'Bulk Add Items', url: "{{ url_for('production_bp.bulk_production_page') }}", icon: 'fa-cubes-stacked' }

            ]

        },

        'Glass': {

            icon: 'fa-sheet-plastic',

            bg: 'bg-info text-white',

            subBg: 'bg-info text-white',

            backBg: 'bg-secondary text-white',

            items: [

                { name: 'Go Back', url: '#', action: 'goBack', isBack: true, icon: 'fa-arrow-left' },

                { name: 'Create Glass', url: "{{ url_for('glass_bp.create_glass') }}", icon: 'fa-square-plus' },

                { name: 'List Glass', url: "{{ url_for('glass_bp.list_glass') }}", icon: 'fa-list-check' },

                { name: 'Glass Inventory', url: "{{ url_for('glass_bp.glass_inventory') }}", icon: 'fa-boxes-stacked' },

                { name: 'Glass Bulk Input', url: "{{ url_for('glass_bp.bulk_inventory_adjustment') }}", icon: 'fa-cubes-stacked' },

                { name: 'Glass Web Scraper', url: "{{ url_for('scraper_bp.scrape_glass_page') }}", icon: 'fa-globe' }

            ]

        },

        'Misc Items': {

            icon: 'fa-toolbox',

            bg: 'bg-warning text-dark',

            subBg: 'bg-warning text-dark',

            backBg: 'bg-secondary text-white',

            items: [

                { name: 'Go Back', url: '#', action: 'goBack', isBack: true, icon: 'fa-arrow-left' },

                { name: 'Create Misc Item', url: "{{ url_for('misc_bp.create_misc') }}", icon: 'fa-square-plus' },

                { name: 'List Misc Items', url: "{{ url_for('misc_bp.list_misc') }}", icon: 'fa-list-check' },

                { name: 'Misc Item Inventory', url: "{{ url_for('misc_bp.misc_inventory') }}", icon: 'fa-boxes-stacked' }

            ]

        },

        'Sales': {

            icon: 'fa-cash-register',

            bg: 'bg-success text-white',

            subBg: 'bg-success text-white',

            backBg: 'bg-secondary text-white',

            items: [

                { name: 'Go Back', url: '#', action: 'goBack', isBack: true, icon: 'fa-arrow-left' },

                { name: 'End of Day Sales', url: "{{ url_for('item_bp.item_bulk_sales') }}", icon: 'fa-cash-register' },

                { name: 'List of Sales', url: "{{ url_for('item_bp.list_sales') }}", icon: 'fa-receipt' },

                { name: 'Sales Visualization', url: "{{ url_for('visuals_bp.sales_visuals') }}", icon: 'fa-chart-line' },

                { name: 'Hourly Sales Input', url: "{{ url_for('item_bp.hourly_sales') }}", icon: 'fa-clock' },

                { name: 'Hourly Sales Visualization', url: "{{ url_for('item_bp.hourly_visuals') }}", icon: 'fa-chart-column' }

            ]

        },

        'Workflow': {

            icon: 'fa-diagram-project',

            bg: 'bg-danger text-white',

            directUrl: "{{ url_for('production_bp.production_board') }}"

        },

        'Other': {

            icon: 'fa-ellipsis',

            bg: 'bg-secondary text-white',

            subBg: 'bg-secondary text-white',

            backBg: 'bg-secondary text-white',

            items: [

                { name: 'Go Back', url: '#', action: 'goBack', isBack: true, icon: 'fa-arrow-left' },

                { name: 'Settings', url: "{{ url_for('settings') }}", icon: 'fa-gear' },

                { name: 'Create Venue', url: "{{ url_for('venue_bp.create_venue') }}", icon: 'fa-store' },

                { name: 'List Venues', url: "{{ url_for('venue_bp.list_venues') }}", icon: 'fa-mountain-city' },

                { name: 'Expense and Revenue Report', url: "{{ url_for('report_bp.expense_revenue_report') }}", icon: 'fa-file-invoice-dollar' }

            ]

        }

    };



    function renderMainView() {

        const container = document.getElementById('hub-container');

        container.innerHTML = '';

        

        Object.keys(categoryConfig).forEach(title => {

            const block = categoryConfig[title];

            const col = document.createElement('div');

            col.className = 'col-md-4 col-sm-6 fade-transition';

            col.innerHTML = `

                <div class="card hub-card shadow-sm h-100 square-box ${block.bg}">

                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-3">

                        <i class="fa-solid ${block.icon} fa-3x mb-3"></i>

                        <h4 class="card-title fw-bold">${title}</h4>

                    </div>

                </div>

            `;

            

            col.querySelector('.card').addEventListener('click', () => {

                if (block.directUrl) {

                    window.location.href = block.directUrl;

                } else {

                    renderSubView(title);

                }

            });

            container.appendChild(col);

        });

    }



    function renderSubView(categoryKey) {

        const container = document.getElementById('hub-container');

        container.innerHTML = '';

        

        const config = categoryConfig[categoryKey];

        const items = config.items || [];

        

        items.forEach(sub => {

            const col = document.createElement('div');

            col.className = 'col-md-4 col-sm-6 fade-transition';

            

            const cardTheme = sub.isBack ? config.backBg : config.subBg;

            

            col.innerHTML = `

                <div class="card hub-card shadow-sm h-100 square-box ${cardTheme}">

                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-3">

                        <i class="fa-solid ${sub.icon || 'fa-circle'} fa-2x mb-3"></i>

                        <h5 class="card-title fw-bold mb-0">${sub.name}</h5>

                    </div>

                </div>

            `;

            

            const cardElement = col.querySelector('.card');

            cardElement.addEventListener('click', () => {

                if (sub.action === 'goBack') {

                    renderMainView();

                } else {

                    window.location.href = sub.url;

                }

            });

            

            container.appendChild(col);

        });

    }



    // Initialize the main view on page load

    document.addEventListener('DOMContentLoaded', renderMainView);

</script>

{% endblock %}
