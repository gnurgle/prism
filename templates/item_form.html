{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{{ action }} Item</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Item Name (ITMNAME)</label>
                        <input type="text" name="ITMNAME" class="form-control" value="{{ item.ITMNAME if item else '' }}" required maxlength="25">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Item Group (ITMGRP)</label>
                            <select name="ITMGRP" class="form-select">
                                <option value="">-- Select Group --</option>
                                {% for group in groups %}
                                    <option value="{{ group.ITMGRP }}" {% if item and item.ITMGRP == group.ITMGRP %}selected{% endif %}>
                                        {{ group.ITMGRP }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Variant (VARIID)</label>
                            <select name="VARIID" class="form-select">
                                <option value="">-- Select Variant --</option>
                                {% for variant in variants %}
                                    <option value="{{ variant.VARIID }}" {% if item and item.VARIID == variant.VARIID %}selected{% endif %}>
                                        {{ variant.ITMVARI }} (Group: {{ variant.ITMGRP }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Image Path (ITMIMG)</label>
                            <input type="text" name="ITMIMG" class="form-control" value="{{ item.ITMIMG if item else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Pattern Link (ITMPTRN)</label>
                            <input type="text" name="ITMPTRN" class="form-control" value="{{ item.ITMPTRN if item else '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Item Flags</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="CURRENT" id="CURRENT" {% if not item or item.CURRENT %}checked{% endif %}>
                            <label class="form-check-label" for="CURRENT">Currently Being Sold (CURRENT)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="ONEOFF" id="ONEOFF" {% if item and item.ONEOFF %}checked{% endif %}>
                            <label class="form-check-label" for="ONEOFF">One-Off Item (ONEOFF)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="VARIAT" id="VARIAT" {% if item and item.VARIAT %}checked{% endif %}>
                            <label class="form-check-label" for="VARIAT">Has Variations (VARIAT)</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notes (ITMNOTE)</label>
                        <textarea name="ITMNOTE" class="form-control" rows="3">{{ item.ITMNOTE if item else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">{{ action }} Save Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
