{% extends 'base.html' %}

{% block content %}
<!-- Reference the separate stylesheet for 25% transparency and effects -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/svg_effects.css') }}">

<div class="row vh-80">
    <!-- Sidebar: Component Information & Edit Form -->
    <div class="col-md-4 bg-white border-end p-4 shadow-sm" style="height: 80vh; overflow-y: auto;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Component Details</h4>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">Back</a>
        </div>
        <hr>
        
        <div id="no-selection-msg" class="text-muted text-center py-5">
            <p>Click any region in the SVG viewer to view and edit component properties.</p>
        </div>

        <form id="component-form" method="POST" action="{{ url_for('update_component') }}" style="display: none;">
            <input type="hidden" name="item_id" value="{{ item.ITEMID }}">
            <input type="hidden" id="comp_id" name="comp_id">

            <div class="mb-3">
                <label for="comp_num" class="form-label fw-bold">Component Number (COMPNUM)</label>
                <input type="number" class="form-control" id="comp_num" name="comp_num">
            </div>

            <div class="mb-3">
                <label for="comp_name" class="form-label fw-bold">Component Name (COMPNAME)</label>
                <input type="text" class="form-control" id="comp_name" name="comp_name">
            </div>

            <div class="row">
                <div class="col-6 mb-3">
                    <label for="comp_len" class="form-label fw-bold">Length (COMPLEN)</label>
                    <input type="number" step="any" class="form-control" id="comp_len" name="comp_len">
                </div>
                <div class="col-6 mb-3">
                    <label for="comp_wid" class="form-label fw-bold">Width (COMPWID)</label>
                    <input type="number" step="any" class="form-control" id="comp_wid" name="comp_wid">
                </div>
            </div>

            <div class="mb-3">
                <label for="glass_id" class="form-label fw-bold">Component Glass (GSI)</label>
                <select class="form-select" id="glass_id" name="glass_id">
                    <option value="">-- Select Glass --</option>
                    {% for glass in glass_options %}
                        <option value="{{ glass.GLASSID }}">{{ glass.GLSNAME }} (ID: {{ glass.GLASSID }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="isscrap" name="isscrap" value="1">
                <label class="form-check-label" for="isscrap">Is Scrap (ISSCRAP)</label>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="isgrain" name="isgrain" value="1">
                <label class="form-check-label" for="isgrain">Grain Specific (ISGRAIN)</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">Save Changes</button>
        </form>
    </div>

    <!-- Main Focus: Interactive SVG Canvas -->
    <div class="col-md-8 d-flex flex-column align-items-center justify-content-center bg-light p-3" style="height: 80vh;">
        <h5 class="text-secondary mb-2">{{ item.ITMNAME }} - Interactive Layout</h5>
        
        <!-- SVG Container with relative positioning for absolute toggle buttons in top-right -->
        <div id="svg-wrapper" class="svg-container border rounded bg-white p-2 shadow-sm w-100 h-100 d-flex justify-content-center align-items-center overflow-hidden position-relative" style="background-color: #ffffff; transition: background 0.3s ease;">
            
            <!-- Top-left overlay buttons for appearance mode -->
            <div style="position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 5px;">
                <button id="mode-chex-btn" type="button" class="btn btn-sm btn-secondary active" title="Color by Palette (CHEX)" onclick="setAppearanceMode('chex')">🎨</button>
                <button id="mode-img-btn" type="button" class="btn btn-sm btn-light" title="Fill with Image (GLSIMG)" onclick="setAppearanceMode('image')">🖼️</button>
            </div>

            <!-- Background Toggle Buttons (Top-Right) -->
            <div class="position-absolute top-0 end-0 m-3 z-3 btn-group shadow-sm" role="group" aria-label="Background Switcher">
                <button type="button" class="btn btn-light btn-sm border bg-white" id="bg-white-btn" title="White Background" onclick="setSvgBackground('white')">
                    <span style="display:inline-block; width:14px; height:14px; background:#ffffff; border:1px solid #ccc; vertical-align:middle;"></span>
                </button>
                <button type="button" class="btn btn-light btn-sm border" id="bg-outside-btn" title="Outside Background" onclick="setSvgBackground('outside')">
                    ☀️
                </button>
                <button type="button" class="btn btn-light btn-sm border" id="bg-transparent-btn" title="Transparent Background" onclick="setSvgBackground('transparent')">
                    <span style="display:inline-block; width:14px; height:14px; background:repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0/10px 10px; border:1px solid #222; vertical-align:middle;"></span>
                </button>
            </div>

            <!-- Reactive Joystick (Bottom-Left) -->
            <div id="bg-joystick" class="position-absolute bottom-0 start-0 m-3 z-3 bg-dark bg-opacity-50 border border-secondary rounded-circle shadow-lg d-flex align-items-center justify-content-center" style="display: none; width: 100px; height: 100px; touch-action: none; cursor: grab;">
                <div id="joystick-knob" class="bg-white bg-opacity-75 rounded-circle shadow-sm position-absolute" style="width: 44px; height: 44px; transition: transform 0.05s linear; pointer-events: none;"></div>
            </div>

            <object data="{{ svg_url }}" type="image/svg+xml" id="svg-object" style="width: 100%; height: 100%; object-fit: contain;"></object>

            <!-- Bottom-right overlay buttons for stroke-width adjustment -->
            <div style="position: absolute; bottom: 10px; right: 10px; z-index: 10; display: flex; gap: 5px;">
                <button id="stroke-thin-btn" type="button" class="btn btn-sm btn-secondary active text-white font-weight-bold shadow-sm" title="Thin Line" onclick="setStrokeWidth(2)">🔽</button>
                <button id="stroke-thick-btn" type="button" class="btn btn-sm btn-light text-dark font-weight-bold shadow-sm" title="Thick Line" onclick="setStrokeWidth(22)">🔼</button>
            </div>
        </div>
    </div>
</div>

<!-- Global Configurations for JS files -->
<script>
    const componentsData = {{ components_json | tojson }};
    const outsideBgUrl = "{{ url_for('static', filename='images/backgrounds/outside.jpg') }}";
    const glassImgBaseUrl = "{{ url_for('static', filename='/') }}";
    const effectImgBaseUrl = "{{ url_for('static', filename='images/effects/') }}";
</script>

<!-- Referenced JS Modules -->
<script src="{{ url_for('static', filename='js/joystick_background.js') }}"></script>
<script src="{{ url_for('static', filename='js/component_sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/svg_renderer.js') }}"></script>

{% endblock %}
