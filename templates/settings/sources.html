{% extends 'base.html' %}



{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">

    <div>

        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm mb-2">&larr; Back to Dashboard</a>

        <h2>Glass Source Management (GSL)</h2>

    </div>

</div>



<div class="row">

    <!-- Dynamic Sideboard -->

    <div class="col-md-3">

        {% include 'settings/_sideboard.html' %}

    </div>



    <!-- Main Content Area -->

    <div class="col-md-9">

        <!-- Add Source Card -->

        <div class="card shadow-sm mb-4">

            <div class="card-header bg-secondary text-white">Add New Glass Source</div>

            <div class="card-body">

                <form method="POST">

                    <input type="hidden" name="action" value="add">

                    <div class="mb-3">

                        <label for="GLSOURCE" class="form-label fw-bold">Source Name:</label>

                        <input type="text" id="GLSOURCE" name="GLSOURCE" class="form-control" required>

                    </div>

                    <div class="mb-3">

                        <label for="GLSNOTE" class="form-label fw-bold">Notes:</label>

                        <textarea id="GLSNOTE" name="GLSNOTE" class="form-control" rows="2"></textarea>

                    </div>

                    <div class="row mb-3">

                        <div class="col-auto">

                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" id="SRCWEB" name="SRCWEB">

                                <label class="form-check-label" for="SRCWEB">Web Link Available</label>

                            </div>

                        </div>

                        <div class="col-auto">

                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" id="ISACTIVE" name="ISACTIVE" checked>

                                <label class="form-check-label" for="ISACTIVE">Active</label>

                            </div>

                        </div>

                    </div>

                    <button type="submit" class="btn btn-success">Add Source</button>

                </form>

            </div>

        </div>



        <!-- Existing Sources Table -->

        <div class="card shadow-sm">

            <div class="card-header bg-dark text-white">Existing Glass Sources</div>

            <div class="card-body p-0">

                <table class="table table-striped mb-0 align-middle">

                    <thead>

                        <tr>

                            <th>Source Name</th>

                            <th>Notes</th>

                            <th>Web</th>

                            <th>Active</th>

                            <th class="text-end">Actions</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for src in sources %}

                        <tr>

                            <form method="POST">

                                <input type="hidden" name="action" value="modify">

                                <input type="hidden" name="ORIG_GLSOURCE" value="{{ src.GLSOURCE }}">

                                <td>

                                    <input type="text" name="GLSOURCE" value="{{ src.GLSOURCE }}" class="form-control form-control-sm" required>

                                </td>

                                <td>

                                    <input type="text" name="GLSNOTE" value="{{ src.GLSNOTE or '' }}" class="form-control form-control-sm">

                                </td>

                                <td>

                                    <div class="form-check">

                                        <input class="form-check-input" type="checkbox" name="SRCWEB" {% if src.SRCWEB == 1 %}checked{% endif %}>

                                    </div>

                                </td>

                                <td>

                                    <div class="form-check">

                                        <input class="form-check-input" type="checkbox" name="ISACTIVE" {% if src.ISACTIVE == 1 %}checked{% endif %}>

                                    </div>

                                </td>

                                <td class="text-end">

                                    <button type="submit" class="btn btn-primary btn-sm">Update</button>

                                </td>

                            </form>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
